name: Release 🏗️

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Handle release 🦋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # changesets/action opens the "version packages" PR; on its merge it runs
      # the publish script. This is a git-dependency package (consumed via
      # github:omnidotdev/sigil-tokens), so `changeset publish` only tags the
      # private package (privatePackages.tag) and does not publish to npm.
      - name: Create release PR or tag release
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: bun release
          pr-title: "feature(release): version packages"
          commit-message: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
