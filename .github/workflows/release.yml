name: Release 🏗️

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Handle release 🦋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # changesets/action opens the "version packages" PR; on its merge it runs
      # the publish script, which builds and publishes the public package to npm
      # (it is also consumable as a git dependency via the committed build/).
      - name: Create release PR or publish package
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: bun release
          pr-title: "feature(release): version packages"
          commit-message: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
